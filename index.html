<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watermelon Merge Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #020617;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #020617 70%);
        }

        ::-webkit-scrollbar { display: none; }

        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #game-container canvas {
            display: block;
            max-width: 100%;
            max-height: 60vh; /* スマホやプレビュー環境で下端が見えるように高さを制限 */
            width: auto;      /* アスペクト比を維持 */
            height: auto;
            margin: 0 auto;   /* 中央揃え */
            touch-action: none;
            outline: none;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
        }

        @media (min-width: 768px) {
            #game-container canvas {
                max-height: 85vh; /* PC画面では少し大きく表示 */
            }
        }

        /* 読み込み中のアニメーション用 */
        .dot-flashing {
            position: relative;
            width: 8px;
            height: 8px;
            border-radius: 5px;
            background-color: #a855f7;
            color: #a855f7;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0.5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: '';
            display: inline-block;
            position: absolute;
            top: 0;
        }
        .dot-flashing::before {
            left: -12px;
            width: 8px;
            height: 8px;
            border-radius: 5px;
            background-color: #a855f7;
            color: #a855f7;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 0s;
        }
        .dot-flashing::after {
            left: 12px;
            width: 8px;
            height: 8px;
            border-radius: 5px;
            background-color: #a855f7;
            color: #a855f7;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 1s;
        }
        @keyframes dot-flashing {
            0% { background-color: #a855f7; }
            50%, 100% { background-color: rgba(168, 85, 247, 0.2); }
        }
    </style>
</head>
<body class="min-h-[100dvh] flex flex-col p-2 sm:p-4 text-white overflow-x-hidden overflow-y-auto">

    <div class="flex flex-col md:flex-row gap-4 sm:gap-6 w-full max-w-5xl m-auto justify-center items-center md:items-start">
        
        <!-- 左側サイドパネル -->
        <div class="flex flex-row flex-wrap md:flex-col gap-3 sm:gap-4 w-full md:w-64 order-2 md:order-1">
            
            <!-- タイトル (PC用) -->
            <div class="text-center md:text-left hidden md:block mb-2 w-full">
                <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 mb-1 drop-shadow-lg">Merge<br>Fruits</h1>
                <p class="text-slate-400 text-xs font-bold tracking-[0.2em]">PHYSICS PUZZLE</p>
            </div>
            
            <div class="flex flex-row md:flex-col w-full gap-3 sm:gap-4">
                <!-- スコアボード -->
                <div class="glass-panel flex-1 p-3 sm:p-5 rounded-2xl shadow-xl flex flex-col items-center justify-center relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-br from-indigo-500/10 to-purple-500/10 opacity-50 group-hover:opacity-100 transition-opacity duration-500"></div>
                    <span class="text-slate-400 text-xs font-bold mb-1 tracking-widest relative z-10">SCORE</span>
                    <span id="score-display" class="text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-300 relative z-10 tabular-nums drop-shadow-md">0</span>
                    <span id="combo-display" class="absolute bottom-1 md:bottom-2 text-pink-500 font-black text-xs md:text-sm opacity-0 transition-opacity duration-200 z-10 drop-shadow-md">COMBO x1</span>
                </div>

                <!-- NEXT フルーツ -->
                <div class="glass-panel flex-1 p-3 sm:p-5 rounded-2xl shadow-xl flex flex-col items-center justify-center relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/10 to-teal-500/10 opacity-50 group-hover:opacity-100 transition-opacity duration-500"></div>
                    <span class="text-slate-400 text-xs font-bold mb-2 sm:mb-3 tracking-widest relative z-10">NEXT</span>
                    <div id="next-fruit-display" class="relative z-10 flex items-center justify-center rounded-full transition-transform duration-300" style="width: 60px; height: 60px; sm:width: 70px; sm:height: 70px;">
                        <!-- JSで挿入 -->
                    </div>
                </div>
            </div>

            <!-- ✨ AI アドバイス機能 -->
            <div class="glass-panel w-full p-4 rounded-2xl shadow-xl flex flex-col items-center relative overflow-hidden border border-purple-500/30">
                <div class="absolute inset-0 bg-gradient-to-b from-purple-900/20 to-transparent"></div>
                <div class="relative z-10 w-full flex flex-col items-center">
                    <button id="ai-advice-btn" class="w-full py-2 mb-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold rounded-lg shadow-lg transform transition-all hover:scale-105 active:scale-95 text-sm flex items-center justify-center gap-2">
                        ✨ AI 実況・アドバイス
                    </button>
                    <div class="w-full min-h-[60px] bg-slate-900/50 rounded-lg p-3 text-sm text-slate-300 flex items-center justify-center text-center relative">
                        <div id="ai-advice-loading" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                            <div class="dot-flashing"></div>
                        </div>
                        <p id="ai-advice-text" class="italic">「ボタンを押して、AIの神実況を聞こう！」</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- ゲームエリア -->
        <div class="relative order-1 md:order-2">
            
            <!-- タイトル (スマホ用) -->
            <div class="text-center mb-2 md:hidden">
                <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 drop-shadow-md">Merge Fruits</h1>
            </div>

            <!-- キャンバスコンテナ -->
            <div id="container-wrapper" class="relative rounded-3xl overflow-hidden shadow-[0_0_40px_-10px_rgba(236,72,153,0.3)] border border-slate-700/50 bg-[#0f172a] transition-shadow duration-700 hover:shadow-[0_0_50px_-10px_rgba(139,92,246,0.4)]">
                <div id="game-container"></div>
                
                <!-- ゲームオーバー画面 -->
                <div id="game-over" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md flex-col items-center justify-center z-50 p-6 text-center">
                    <h2 class="text-5xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-violet-500 mb-2 drop-shadow-[0_0_20px_rgba(236,72,153,0.6)] tracking-tight">GAME OVER</h2>
                    <p class="text-slate-300 text-lg mb-6 font-bold tracking-wider">SCORE <span id="final-score" class="text-4xl sm:text-5xl text-white ml-2 tabular-nums">0</span></p>
                    
                    <!-- ✨ AI 最終評価 -->
                    <div class="w-full max-w-sm bg-purple-900/30 border border-purple-500/40 rounded-xl p-4 mb-8 relative min-h-[100px] flex flex-col items-center justify-center shadow-[0_0_15px_rgba(168,85,247,0.2)]">
                        <span class="absolute -top-3 bg-[#0f172a] px-3 text-xs font-bold text-purple-400 tracking-widest rounded-full border border-purple-500/40">✨ AI 最終評価 ✨</span>
                        <div id="ai-eval-loading" class="hidden">
                            <div class="dot-flashing mt-4 mb-2"></div>
                        </div>
                        <p id="ai-eval-text" class="text-white text-sm sm:text-base font-bold leading-relaxed whitespace-pre-wrap"></p>
                    </div>

                    <button id="retry-btn" class="px-8 py-4 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold rounded-full shadow-[0_0_20px_rgba(236,72,153,0.5)] transform transition-all hover:scale-105 active:scale-95 tracking-widest text-sm sm:text-base">
                        PLAY AGAIN
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Gemini API 統合 ---
        const apiKey = ""; // ランタイムで提供されます

        async function fetchGeminiWithRetry(prompt, systemPrompt, isEval = false, retries = 5) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const result = await response.json();
                    if (result.candidates && result.candidates[0] && result.candidates[0].content) {
                        return result.candidates[0].content.parts[0].text;
                    }
                    throw new Error("Invalid response format");
                } catch (error) {
                    if (i === retries - 1) {
                        return isEval 
                            ? "評価の取得に失敗しました。でもナイスプレイ！" 
                            : "AI実況者が席を外しているようです…（通信エラー）";
                    }
                    const delay = Math.pow(2, i) * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

        // --- AI 実況・アドバイス機能 ---
        document.getElementById('ai-advice-btn').addEventListener('click', async () => {
            const textEl = document.getElementById('ai-advice-text');
            const loadingEl = document.getElementById('ai-advice-loading');
            
            textEl.classList.add('invisible');
            loadingEl.classList.remove('hidden');

            const currentF = FRUITS[currentFruitType];
            const nextF = FRUITS[nextFruitType];
            
            const prompt = `現在のスコアは ${score} 点です。今持っているフルーツは「${currentF.emoji}」、次に落ちてくるのは「${nextF.emoji}」です。プレイヤーに向けて、面白くて励みになる実況コメントやちょっとした戦略的アドバイスを日本語で1〜2行で提供してください。`;
            const systemPrompt = "あなたはテンションが高く、少しユーモアのあるeスポーツゲーム実況者です。フルーツのマージゲーム（スイカゲーム風）の実況をしています。短く、絵文字を使って元気に出力してください。";

            const advice = await fetchGeminiWithRetry(prompt, systemPrompt);
            
            loadingEl.classList.add('hidden');
            textEl.innerText = advice;
            textEl.classList.remove('invisible');
        });

        // --- ゲーム設定・定数 ---
        const CANVAS_WIDTH = 400;
        const CANVAS_HEIGHT = 600;
        const GAMEOVER_LINE_Y = 120;
        
        const FRUITS = [
            { level: 0, radius: 14, color: "#ff0800", emoji: "🍒" },
            { level: 1, radius: 20, color: "#ff5c77", emoji: "🍓" },
            { level: 2, radius: 28, color: "#8a2be2", emoji: "🍇" },
            { level: 3, radius: 35, color: "#ffa500", emoji: "🍊" },
            { level: 4, radius: 44, color: "#ff7f50", emoji: "🍋" },
            { level: 5, radius: 54, color: "#ff0000", emoji: "🍎" },
            { level: 6, radius: 65, color: "#e4d00a", emoji: "🍐" },
            { level: 7, radius: 78, color: "#ffb6c1", emoji: "🍑" },
            { level: 8, radius: 92, color: "#ffff00", emoji: "🍍" },
            { level: 9, radius: 108, color: "#a8e4a0", emoji: "🍈" },
            { level: 10, radius: 126, color: "#228b22", emoji: "🍉" }
        ];

        const SCORE_MAP = [0, 10, 30, 60, 100, 150, 210, 280, 360, 450, 550, 1000];

        // --- ゲーム状態 ---
        let score = 0;
        let combo = 1;
        let lastDropTime = 0;
        let comboTimer = null;
        let isGameOver = false;
        let canDrop = true;
        let mergeMissCount = 0;
        let hasMergedSinceLastDrop = true;
        const PENALTY_THRESHOLD = 2;
        const PENALTY_SCORE = 50;
        let currentFruitType = getRandomStartFruit();
        let nextFruitType = getRandomStartFruit();
        let dropX = CANVAS_WIDTH / 2;
        let overflowCount = 0;
        let particles = [];
        let maxFruitLevelAchieved = 0;

        // --- Matter.js セットアップ ---
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Events = Matter.Events;

        const engine = Engine.create();
        const render = Render.create({
            element: document.getElementById('game-container'),
            engine: engine,
            options: {
                width: CANVAS_WIDTH,
                height: CANVAS_HEIGHT,
                wireframes: false,
                background: 'transparent',
                pixelRatio: window.devicePixelRatio
            }
        });

        const wallOptions = { 
            isStatic: true, 
            render: { fillStyle: '#1e293b' },
            friction: 0.3,
            restitution: 0.2
        };
        const thick = 60;
        const floor = Bodies.rectangle(CANVAS_WIDTH / 2, CANVAS_HEIGHT + thick / 2, CANVAS_WIDTH + thick * 2, thick, wallOptions);
        const leftWall = Bodies.rectangle(0 - thick / 2, CANVAS_HEIGHT / 2, thick, CANVAS_HEIGHT * 2, wallOptions);
        const rightWall = Bodies.rectangle(CANVAS_WIDTH + thick / 2, CANVAS_HEIGHT / 2, thick, CANVAS_HEIGHT * 2, wallOptions);
        
        Composite.add(engine.world, [floor, leftWall, rightWall]);

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        updateNextFruitUI();

        // --- 入力制御 ---
        let isTouching = false;
        let autoDropInterval = null;
        const canvasEl = render.canvas;
        canvasEl.classList.add('cursor-crosshair');

        function startAutoDrop() {
            if (autoDropInterval) clearInterval(autoDropInterval);
            if (canDrop && !isGameOver) dropFruit();
            // 長押し中はこまめにドロップ可能かチェックして投下
            autoDropInterval = setInterval(() => {
                if (canDrop && isTouching && !isGameOver) {
                    dropFruit();
                }
            }, 50);
        }

        function stopAutoDrop() {
            if (autoDropInterval) {
                clearInterval(autoDropInterval);
                autoDropInterval = null;
            }
        }

        canvasEl.addEventListener('pointerdown', (e) => {
            if (isGameOver) return;
            isTouching = true;
            updateDropX(e);
            startAutoDrop();
        });

        canvasEl.addEventListener('pointermove', (e) => {
            if (isGameOver) return;
            if (e.pointerType === 'mouse' || isTouching) {
                updateDropX(e);
            }
        });

        canvasEl.addEventListener('pointerup', (e) => {
            if (isGameOver) return;
            isTouching = false;
            stopAutoDrop();
        });

        canvasEl.addEventListener('pointerleave', () => {
            isTouching = false;
            stopAutoDrop();
        });

        function updateDropX(e) {
            const rect = canvasEl.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const x = (e.clientX - rect.left) * scaleX;
            const r = FRUITS[currentFruitType].radius;
            dropX = Math.max(r + 5, Math.min(x, CANVAS_WIDTH - r - 5));
        }

        // --- ゲームロジック ---
        function getRandomStartFruit() {
            const rand = Math.random();
            if (rand < 0.4) return 0;
            if (rand < 0.7) return 1;
            if (rand < 0.85) return 2;
            if (rand < 0.95) return 3;
            return 4;
        }

        function dropFruit() {
            canDrop = false;

            // コンボの計算をペナルティ判定より先に行う
            const now = Date.now();
            if (now - lastDropTime < 800) {
                combo++;
            } else {
                combo = 1;
            }
            lastDropTime = now;
            updateComboUI();

            // 0.8秒間アクションがなければコンボリセット
            clearTimeout(comboTimer);
            comboTimer = setTimeout(() => {
                combo = 1;
                updateComboUI();
            }, 800);

            // ペナルティ判定 (前回の落下で合体があったか)
            if (!hasMergedSinceLastDrop) {
                mergeMissCount++;
                if (mergeMissCount >= PENALTY_THRESHOLD) {
                    const penaltyAmount = PENALTY_SCORE * combo; // 減点にもコンボ倍率を適用
                    score = Math.max(0, score - penaltyAmount);
                    showPenaltyEffect(penaltyAmount);
                    updateScoreDisplay();
                    mergeMissCount = 0;
                }
            } else {
                mergeMissCount = 0;
            }
            updateMissUI();
            hasMergedSinceLastDrop = false;

            const fruitDef = FRUITS[currentFruitType];
            
            if (currentFruitType > maxFruitLevelAchieved) maxFruitLevelAchieved = currentFruitType;

            const fruit = Bodies.circle(dropX, 40, fruitDef.radius, {
                render: { fillStyle: fruitDef.color },
                restitution: 0.2,
                friction: 0.1,
                density: 0.001 * (currentFruitType + 1),
                fruitLevel: currentFruitType
            });
            
            Composite.add(engine.world, fruit);

            currentFruitType = nextFruitType;
            nextFruitType = getRandomStartFruit();
            updateNextFruitUI();

            setTimeout(() => { if (!isGameOver) canDrop = true; }, 100);
        }

        Events.on(engine, 'collisionStart collisionActive', (event) => {
            const pairs = event.pairs;
            const bodiesToRemove = new Set();
            const newFruitsData = [];
            let triggerWatermelonExplosion = false;
            let explosionX = 0, explosionY = 0;

            pairs.forEach((pair) => {
                const { bodyA, bodyB } = pair;

                if (bodyA.fruitLevel !== undefined && bodyB.fruitLevel !== undefined) {
                    if (bodyA.fruitLevel === bodyB.fruitLevel) {
                        // 空中合体を防ぐ: 両方のフルーツが一定以上の速度(落下中・飛翔中)の場合はマージを保留
                        if (bodyA.speed > 1.5 && bodyB.speed > 1.5) {
                            return;
                        }

                        if (bodiesToRemove.has(bodyA.id) || bodiesToRemove.has(bodyB.id)) return;

                        const newLevel = bodyA.fruitLevel + 1;
                        if (newLevel > maxFruitLevelAchieved) maxFruitLevelAchieved = newLevel;

                        bodiesToRemove.add(bodyA.id);
                        bodiesToRemove.add(bodyB.id);

                        const midX = (bodyA.position.x + bodyB.position.x) / 2;
                        const midY = (bodyA.position.y + bodyB.position.y) / 2;

                        if (newLevel === 10) { // 🍉 スイカ完成！爆発フラグを立てる
                            triggerWatermelonExplosion = true;
                            explosionX = midX;
                            explosionY = midY;
                            score += 10000 * combo; // スイカ爆発特大ボーナス
                        } else if (newLevel < FRUITS.length) {
                            newFruitsData.push({ x: midX, y: midY, level: newLevel });
                            score += SCORE_MAP[newLevel] * combo;
                        }
                        
                        hasMergedSinceLastDrop = true; // マージ成功フラグを立てる
                        
                        updateScoreDisplay();
                        createParticles(midX, midY, FRUITS[bodyA.fruitLevel].color);
                    }
                }
            });

            if (triggerWatermelonExplosion) {
                // 盤面上の全フルーツを削除リストに追加
                const allBodies = Composite.allBodies(engine.world);
                allBodies.forEach(b => {
                    if (b.fruitLevel !== undefined) {
                        bodiesToRemove.add(b.id);
                    }
                });
                
                // 大爆発エフェクトを発生
                createExplosionParticles(explosionX, explosionY);
                // 新しいフルーツ（スイカ自体）は残さず吹き飛ばす
                newFruitsData.length = 0; 
            }

            if (bodiesToRemove.size > 0) {
                const bodies = Composite.allBodies(engine.world).filter(b => bodiesToRemove.has(b.id));
                Composite.remove(engine.world, bodies);

                newFruitsData.forEach(data => {
                    const def = FRUITS[data.level];
                    const newFruit = Bodies.circle(data.x, data.y, def.radius, {
                        render: { fillStyle: def.color },
                        restitution: 0.1,
                        friction: 0.2,
                        density: 0.001 * (data.level + 1),
                        fruitLevel: data.level
                    });
                    Matter.Body.setVelocity(newFruit, { x: (Math.random()-0.5), y: -2 });
                    Composite.add(engine.world, newFruit);
                });
            }
        });

        Events.on(engine, 'beforeUpdate', () => {
            if (isGameOver) return;
            const bodies = Composite.allBodies(engine.world);
            let overflow = false;
            
            for (let b of bodies) {
                if (b.fruitLevel !== undefined) {
                    if (b.position.y < GAMEOVER_LINE_Y && b.speed < 1.0) {
                        overflow = true;
                        break;
                    }
                }
            }
            
            if (overflow) {
                overflowCount++;
                if (overflowCount > 90) triggerGameOver();
            } else {
                overflowCount = Math.max(0, overflowCount - 2); 
            }
        });

        // --- カスタム描画 ---
        Events.on(render, 'afterRender', () => {
            const ctx = render.context;
            
            const bodies = Composite.allBodies(engine.world);
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            for (let body of bodies) {
                if (body.fruitLevel !== undefined) {
                    const fruit = FRUITS[body.fruitLevel];
                    ctx.font = `${fruit.radius * 1.2}px Arial`;
                    
                    ctx.translate(body.position.x, body.position.y);
                    ctx.rotate(body.angle);
                    
                    ctx.shadowColor = "rgba(0,0,0,0.5)";
                    ctx.shadowBlur = 4;
                    ctx.shadowOffsetY = 2;
                    ctx.fillText(fruit.emoji, 0, 0);
                    ctx.shadowColor = "transparent";
                    
                    ctx.rotate(-body.angle);
                    ctx.translate(-body.position.x, -body.position.y);
                }
            }

            ctx.beginPath();
            ctx.moveTo(0, GAMEOVER_LINE_Y);
            ctx.lineTo(CANVAS_WIDTH, GAMEOVER_LINE_Y);
            
            if (overflowCount > 0 && !isGameOver) {
                const intensity = Math.min(1, overflowCount / 90);
                const alpha = (Math.sin(Date.now() / 80) + 1) / 2 * intensity + 0.2;
                ctx.strokeStyle = `rgba(239, 68, 68, ${alpha})`;
                ctx.lineWidth = 3 + intensity * 2;
            } else {
                ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                ctx.lineWidth = 2;
            }
            ctx.setLineDash([8, 8]);
            ctx.stroke();
            ctx.setLineDash([]);

            if (canDrop && !isGameOver) {
                const fruit = FRUITS[currentFruitType];
                const startY = 40;
                
                ctx.beginPath();
                ctx.moveTo(dropX, startY);
                ctx.lineTo(dropX, CANVAS_HEIGHT);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.beginPath();
                ctx.arc(dropX, startY, fruit.radius, 0, 2 * Math.PI);
                ctx.fillStyle = fruit.color;
                ctx.globalAlpha = 0.4;
                ctx.fill();
                
                ctx.globalAlpha = 0.8;
                ctx.font = `${fruit.radius * 1.2}px Arial`;
                ctx.fillText(fruit.emoji, dropX, startY);
                ctx.globalAlpha = 1.0;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.alpha -= (p.decay || 0.03); // 減衰率を個別に設定できるように修正
                
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        });

        // --- ユーティリティ・ゲームオーバー処理 ---
        function updateScoreDisplay() {
            const el = document.getElementById('score-display');
            el.innerText = score;
            el.style.transform = 'scale(1.2)';
            setTimeout(() => { el.style.transform = 'scale(1)'; }, 150);
        }

        function showPenaltyEffect(amount) {
            const el = document.getElementById('score-display');
            // スコアを赤くする
            el.classList.remove('from-white', 'to-slate-300');
            el.classList.add('from-red-500', 'to-red-700');
            el.style.transform = 'scale(1.3) translateX(5px)';
            
            // マイナススコアが浮き出るエフェクト
            const penaltyEl = document.createElement('div');
            penaltyEl.innerText = `-${amount}`;
            penaltyEl.className = 'absolute text-red-500 font-black text-2xl z-20 pointer-events-none drop-shadow-[0_0_8px_rgba(239,68,68,0.8)] whitespace-nowrap';
            penaltyEl.style.top = '50%';
            penaltyEl.style.left = '50%';
            penaltyEl.style.transform = 'translate(-50%, -50%)';
            el.parentElement.appendChild(penaltyEl);

            requestAnimationFrame(() => {
                penaltyEl.style.transition = 'all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                penaltyEl.style.transform = 'translate(-50%, -200%) scale(1.5)';
                penaltyEl.style.opacity = '0';
            });

            setTimeout(() => {
                // 色を元に戻す
                el.classList.remove('from-red-500', 'to-red-700');
                el.classList.add('from-white', 'to-slate-300');
                el.style.transform = 'scale(1)';
                penaltyEl.remove();
            }, 600);
        }

        function updateMissUI() {
            let el = document.getElementById('miss-display');
            if (!el) {
                el = document.createElement('span');
                el.id = 'miss-display';
                el.className = 'absolute top-2 right-3 text-red-500 font-black text-[10px] md:text-xs opacity-0 transition-opacity duration-200 z-10 drop-shadow-md bg-red-950/50 px-2 py-1 rounded-full border border-red-500/30';
                document.getElementById('score-display').parentElement.appendChild(el);
            }
            
            if (mergeMissCount > 0) {
                el.innerText = `NO MERGE ${mergeMissCount}/${PENALTY_THRESHOLD}`;
                el.style.opacity = 1;
            } else {
                el.style.opacity = 0;
            }
        }

        function updateComboUI() {
            const el = document.getElementById('combo-display');
            if (combo > 1) {
                el.innerText = `COMBO x${combo}`;
                el.style.opacity = 1;
                el.style.transform = 'scale(1.2)';
                setTimeout(() => { el.style.transform = 'scale(1)'; }, 100);
            } else {
                el.style.opacity = 0;
            }
        }

        function updateNextFruitUI() {
            const nextF = FRUITS[nextFruitType];
            const display = document.getElementById('next-fruit-display');
            display.style.backgroundColor = nextF.color;
            display.style.boxShadow = `0 0 20px ${nextF.color}80, inset 0 0 10px rgba(255,255,255,0.3)`;
            display.innerHTML = `<span style="font-size: 32px; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">${nextF.emoji}</span>`;
            display.style.transform = 'scale(1.15)';
            setTimeout(() => { display.style.transform = 'scale(1)'; }, 200);
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    radius: Math.random() * 4 + 2,
                    color: color, alpha: 1
                });
            }
        }

        // --- スイカ大爆発エフェクト ---
        function createExplosionParticles(x, y) {
            // スイカカラーの大爆発パーティクル
            for (let i = 0; i < 120; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 20 + 5;
                const colors = ['#228b22', '#ff0000', '#111111', '#ffffff']; // 緑、赤、黒（種）、白
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    radius: Math.random() * 8 + 3,
                    color: color, 
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.005
                });
            }

            // 画面フラッシュ演出
            const wrapper = document.getElementById('container-wrapper');
            const flashEl = document.createElement('div');
            flashEl.className = 'absolute inset-0 bg-white z-40 pointer-events-none transition-opacity duration-1000';
            flashEl.style.opacity = '0.9';
            wrapper.appendChild(flashEl);

            // メッセージ演出
            const msgEl = document.createElement('div');
            msgEl.innerHTML = '🍉 WATERMELON<br>EXPLOSION! 🍉';
            msgEl.className = 'absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-br from-green-400 via-white to-red-500 z-50 pointer-events-none drop-shadow-[0_0_20px_rgba(255,255,255,1)] text-center leading-tight whitespace-nowrap';
            wrapper.appendChild(msgEl);

            requestAnimationFrame(() => {
                setTimeout(() => {
                    flashEl.style.opacity = '0';
                    msgEl.style.transition = 'all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    msgEl.style.transform = 'translate(-50%, -150%) scale(1.2)';
                    msgEl.style.opacity = '0';
                }, 50);
            });

            setTimeout(() => {
                flashEl.remove();
                msgEl.remove();
            }, 1600);
        }

        async function triggerGameOver() {
            isGameOver = true;
            canDrop = false;
            document.getElementById('final-score').innerText = score;
            const gameOverScreen = document.getElementById('game-over');
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.classList.add('flex');

            clearTimeout(comboTimer);
            combo = 1;
            updateComboUI();

            // ✨ AI 評価の生成
            const evalTextEl = document.getElementById('ai-eval-text');
            const evalLoadingEl = document.getElementById('ai-eval-loading');
            evalTextEl.innerText = "";
            evalLoadingEl.classList.remove('hidden');

            const maxFruit = FRUITS[Math.min(maxFruitLevelAchieved, FRUITS.length-1)];
            const prompt = `プレイヤーがフルーツパズルゲームでゲームオーバーになりました。最終スコアは「${score}点」で、作れた最も大きいフルーツは「${maxFruit.emoji}」でした。この結果に基づき、プレイヤーに「【称号】〇〇」の形式でユニークな称号を与え、その後に面白い労いのコメントを添えてください。全体で3行程度に収めてください。`;
            const systemPrompt = "あなたはゲームの神様です。プレイヤーのスコアに応じて、ユーモアを交えた優しい（時々少し辛口な）評価を下します。";

            const evaluation = await fetchGeminiWithRetry(prompt, systemPrompt, true);
            
            evalLoadingEl.classList.add('hidden');
            evalTextEl.innerText = evaluation;
        }

        document.getElementById('retry-btn').addEventListener('click', () => {
            const bodies = Composite.allBodies(engine.world).filter(b => b.fruitLevel !== undefined);
            Composite.remove(engine.world, bodies);
            
            score = 0;
            combo = 1;
            lastDropTime = 0;
            mergeMissCount = 0;
            hasMergedSinceLastDrop = true;
            updateScoreDisplay();
            updateComboUI();
            updateMissUI();
            isGameOver = false;
            overflowCount = 0;
            particles = [];
            maxFruitLevelAchieved = 0;
            currentFruitType = getRandomStartFruit();
            nextFruitType = getRandomStartFruit();
            updateNextFruitUI();
            
            // AIリセット
            document.getElementById('ai-advice-text').innerText = "「ボタンを押して、AIの神実況を聞こう！」";
            
            const gameOverScreen = document.getElementById('game-over');
            gameOverScreen.classList.add('hidden');
            gameOverScreen.classList.remove('flex');
            
            setTimeout(() => { canDrop = true; }, 500);
        });

    </script>
</body>
